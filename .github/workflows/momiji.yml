name: Momiji check and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Keihan updates on Tuesdays and Fridays. Check once on each:
    # 01:17 UTC = 10:17 in Japan.
    - cron: "17 1 * * 2,5"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Read Keihan's foliage report
        if: github.event_name != 'push'
        run: python3 scripts/update_foliage.py

      - name: Save foliage.json if it changed
        id: save
        if: github.event_name != 'push'
        run: |
          if ! git diff --quiet -- foliage.json; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git config user.name "momiji-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add foliage.json
            git commit -m "Momiji update: $(python3 -c 'import json;d=json.load(open("foliage.json"));print(d["asOf"], d["spots"])')"
            git push
          fi

      # A scheduled check with no change skips the redeploy.
      - name: Prepare site files
        if: github.event_name != 'schedule' || steps.save.outputs.changed == 'true'
        run: |
          mkdir -p _site
          cp index.html three.min.js foliage.json _site/

      - uses: actions/configure-pages@v5
        if: github.event_name != 'schedule' || steps.save.outputs.changed == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'schedule' || steps.save.outputs.changed == 'true'
        with:
          path: _site
      - id: deploy
        if: github.event_name != 'schedule' || steps.save.outputs.changed == 'true'
        uses: actions/deploy-pages@v4
